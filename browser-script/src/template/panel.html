<div id="zevent-place-overlay-ui-head">
    <button id="zevent-place-overlay-ui-toggle" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="lucide lucide-chevron-down-icon lucide-chevron-down">
            <path d="m6 9 6 6 6-6"/>
        </svg>
    </button>
    Overlays
    <span id="zevent-place-overlay-ui-version" style="font-size: 70%; padding-left: 1em"></span>
    <div class="zpo-head-actions">
        <button id="btn-settings" aria-expanded="false" title="Paramètres">
            <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            >
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </button>
        <a href="{{scriptUpdateURL}}" alt="Update" target="_blank">
            <button title="Mettre à jour le script">
                <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                >
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                    <path d="M8 16H3v5"/>
                </svg>
            </button>
        </a>
    </div>
</div>
<div id="newUpdate"></div>
<div id="zpo-messages"></div>
<div id="zevent-place-overlay-ui-body" aria-expanded="false">
    <div style="display: flex; align-items: baseline; padding-top: 10px; gap: 8px">
        <label for="enableSymbolsCheckbox">Activer les symboles (mode daltonien)</label>
        <input type="checkbox" id="enableSymbolsCheckbox"/>
    </div>
    <div id="zevent-place-overlay-ui-overlaylist">
        <div class="form-group" id="zpo-custom-add">
            <label for="zevent-place-overlay-ui-input-url">Ajout via URL</label>
            <div class="form-row">
                <input
                        id="zevent-place-overlay-ui-input-url"
                        name="zevent-place-overlay-ui-input-url"
                        type="text"
                        placeholder="https://un-site.com/un-lien-permanent.png"
                />
            </div>
            <div class="form-row" style="padding-top: 8px">
                <input
                        id="zevent-place-overlay-ui-input-x"
                        name="zevent-place-overlay-ui-input-x"
                        type="number"
                        min="0"
                        step="1"
                        placeholder="X"
                        title="Position X sur le canvas (optionnel)"
                />
                <input
                        id="zevent-place-overlay-ui-input-y"
                        name="zevent-place-overlay-ui-input-y"
                        type="number"
                        min="0"
                        step="1"
                        placeholder="Y"
                        title="Position Y sur le canvas (optionnel)"
                />
                <button id="btn-custom-add" title="Ajouter l'overlay">
                    <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                    >
                        <path d="M5 12h14"/>
                        <path d="M12 5v14"/>
                    </svg>
                </button>
            </div>
        </div>
        <hr id="zpo-custom-add-sep"/>
        <div>
            <div class="zpo-section-title">
                <span
                >Overlays actifs
                    <span
                            id="zevent-place-overlay-wanted-ts"
                            style="font-size: 70%; padding-left: 1em"
                    ></span
                    ></span>
                <button id="btn-refresh-wanted">
                    <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                    >
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                        <path d="M21 3v5h-5"/>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                        <path d="M8 16H3v5"/>
                    </svg>
                </button>
            </div>

            <div
                    id="zevent-place-overlay-ui-list-wanted-overlays"
                    style="display: flex; flex-direction: column; gap: 4px"
            ></div>
        </div>
        <hr/>
        <div>
            <div class="zpo-section-title">
                <span
                >Overlays disponibles
                    <span
                            id="zevent-place-overlay-known-ts"
                            style="font-size: 70%; padding-left: 1em"
                    ></span
                    ></span>
                <button id="btn-refresh-known">
                    <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                    >
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                        <path d="M21 3v5h-5"/>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                        <path d="M8 16H3v5"/>
                    </svg>
                </button>
            </div>
            <div class="zpo-section-subtitle">
                Gérés sur le
                <a
                        href="{{inviteDiscordURL}}"
                        alt="Invitation Discord"
                        target="_blank"
                        style="text-decoration: underline"
                >Discord Commu ZEvent/Place
                </a>
            </div>
        </div>
        <div class="form-group">
            <input id="zevent-place-overlay-search" placeholder="Chercher des overlays"/>
        </div>
        <div id="zevent-place-overlay-ui-list-known-overlays"></div>
    </div>
</div>
